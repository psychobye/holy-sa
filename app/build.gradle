plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'org.jetbrains.kotlin.android'
}

android {
    flavorDimensions 'version'
    productFlavors {
        ver_release {
            dimension "version"
            manifestPlaceholders = [appName:"LIT MTA"]
            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
            }

            externalNativeBuild {
                cmake {
                    cppFlags '-fvisibility=hidden'
                }
            }
        }
        ver_test {
            dimension "version"
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
            manifestPlaceholders = [appName:"LIT TEST"]

            firebaseCrashlytics {
                nativeSymbolUploadEnabled false
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    compileSdk 36
    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 36

        namespace 'com.lit.game'
        applicationId 'com.lit.game'
        versionName "5.5"
        versionCode 5

        multiDexEnabled = true

        lintOptions {
            checkReleaseBuilds false
            abortOnError false
        }

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    packagingOptions {
        jniLibs {
            excludes += ['META-INF/*']
        }
        resources {
            excludes += ['META-INF/*']
        }
    }

    ndkVersion '28.0.13004108'

    androidResources {
        noCompress 'mp3'
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
        debug {
            externalNativeBuild {
                cmake {
                    cppFlags '-g'
                }
            }

            debuggable true
            minifyEnabled false
            jniDebuggable false
            renderscriptDebuggable false
        }
    }
    viewBinding {
        enabled = true
    }

    buildFeatures {
        prefab true
    }

    /*applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def appName = variant.productFlavors[0].manifestPlaceholders.appName
            def versionName = variant.versionName
            def buildTypeName = variant.buildType.name

            def newName = "${appName}_v${versionName}_${buildTypeName}.apk"

            output.outputFileName = newName.replaceAll("\\s+", "_")
        }
    }*/
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'com.bytedance.android:shadowhook:1.0.10'
    implementation 'com.airbnb.android:lottie:6.4.0'
    implementation 'com.github.rommansabbir:AnimationX:2.0'
    implementation 'nl.dionsegijn:konfetti-xml:2.0.2'

    implementation 'com.google.android.material:material:1.13.0'
    implementation group: 'org.ini4j', name: 'ini4j', version: '0.5.4'
    implementation "com.github.skydoves:progressview:1.1.3"
    implementation 'com.github.Triggertrap:SeekArc:v1.1'
    implementation 'com.akexorcist:round-corner-progress-bar:2.1.2'
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.13.0'

    implementation platform('com.google.firebase:firebase-bom:34.3.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-crashlytics-ndk'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'

    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    implementation 'com.squareup.picasso:picasso:2.8'

    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.github.valkriaine:Bouncy:2.3'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.0'
    implementation "com.github.skydoves:colorpickerview:2.2.4"
    implementation 'com.github.Mohammad3125:KavehColorPicker:v1.2.1'
    implementation 'com.mikhaellopez:circularprogressbar:3.1.0'
    apply plugin: 'com.google.gms.google-services'

    implementation 'net.orandja.shadowlayout:shadowlayout:1.0.1'
}