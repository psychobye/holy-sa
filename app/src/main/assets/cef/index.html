<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CEF Test</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #BFBFBF;
        }

        .open-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #2C2E2F;
            border: 1px solid #373B3C;
            border-radius: 8px;
            padding: 8px 18px;
            color: #BFBFBF;
            cursor: pointer;
        }

        .window {
            background: #1F2021;
            border: 1px solid #373B3C;
            border-radius: 14px;
            padding: 24px 32px 28px;
            min-width: 280px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            position: relative;
            display: none;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 12px;
            background: none;
            border: none;
            color: #BFBFBF;
            font-size: 18px;
            cursor: pointer;
            opacity: 0.7;
        }

        .close-btn:hover {
            opacity: 1;
        }

        .title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .btn {
            background: #2C2E2F;
            border: 1px solid #373B3C;
            border-radius: 8px;
            padding: 10px 22px;
            color: #BFBFBF;
            cursor: pointer;
        }

        .btn:hover {
            background: #353738;
        }
    </style>
</head>
<body>

<button class="open-btn" onclick="openWindow()">OPEN</button>

<div class="window" id="window">
    <button class="close-btn" onclick="closeWindow()">✕</button>
    <div class="title">TEST CEF</div>
    <button class="btn">SEND</button>
</div>

<script>
    function sendInteractiveAreas() {
        if (!window.CefBridge) return;

        const rects = [];
        const elements = document.querySelectorAll('.window, .open-btn');

        elements.forEach(el => {
            if (window.getComputedStyle(el).display === 'none') return;

            const rect = el.getBoundingClientRect();
            rects.push([rect.x, rect.y, rect.width, rect.height]);
        });

        const flatRects = rects.flat();

        window.CefBridge.updateInteractiveAreas(JSON.stringify(flatRects));
    }

    function openWindow() {
        document.getElementById('window').style.display = 'block';
        sendInteractiveAreas();
    }

    function closeWindow() {
        document.getElementById('window').style.display = 'none';
        sendInteractiveAreas();
    }

    window.onload = sendInteractiveAreas;

    window.onresize = sendInteractiveAreas;
</script>

</body>
</html>
